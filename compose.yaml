services:
  webcam-capture:
    build: .
    image: webcam-capture:latest
    container_name: webcam-capture
    restart: unless-stopped
    devices:
      - /dev/video0:/dev/video0
    group_add:
      - "44" # host video group
    environment:
      TZ: ${WEBCAM_TZ:-UTC}
      WEBCAM_HTTP_ADDR: ":8080"
    ports:
      - "8080:8080" # web UI: latest photo + capture summary
    volumes:
      - ./data:/data
